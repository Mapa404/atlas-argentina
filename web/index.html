<body>
  <a class="skip" href="#main">Saltar al contenido</a>
  <noscript><p style="padding:16px">El Atlas de datos de Argentina necesita JavaScript. Reúne datos públicos de población, vivienda, educación, trabajo, agro, energía y territorio de las 24 provincias y 527 departamentos del país, cada uno con su fuente. Hecho por <a href="https://mapabianchi.online">Mapa Bianchi</a>.</p></noscript>
  <header class="topbar">
    <div class="brand">
      <h1>Atlas de datos de Argentina</h1>
      <p class="brand-sub">Datos públicos por provincia, departamento y localidad</p>
    </div>
    <div class="search" role="search">
      <label for="q" class="sr-only">Buscar provincia, departamento o localidad</label>
      <input id="q" type="search" placeholder="Buscar provincia, departamento o localidad" autocomplete="off" aria-controls="q-results" aria-expanded="false" />
      <ul id="q-results" class="search-results" role="listbox" hidden></ul>
    </div>
    <nav class="views" aria-label="Secciones">
      <button type="button" data-view="mapa" aria-current="page">Mapa</button>
      <button type="button" data-view="explorador">Explorador</button>
      <button type="button" data-view="fuentes">Fuentes</button>
    </nav>
  </header>

  <main id="main">
    <section id="view-mapa" class="view view-mapa" aria-label="Mapa">
      <aside class="panel panel-capas" id="panel-capas" aria-label="Indicadores y capas del mapa">
        <div class="panel-head">
          <h2 class="panel-title">Qué mostrar</h2>
          <div class="seg" role="group" aria-label="Nivel geográfico">
            <button type="button" data-level="p" aria-pressed="true">Provincias</button>
            <button type="button" data-level="d" aria-pressed="false">Departamentos</button>
          </div>
        </div>
        <div class="panel-body" id="lista-indicadores"></div>
        <div class="panel-foot">
          <h3 class="group-title">Capas</h3>
          <div id="lista-capas"></div>
        </div>
      </aside>

      <div class="map-wrap">
        <div id="map" role="region" aria-label="Mapa de Argentina"></div>
        <div class="legend" id="legend" aria-live="polite"></div>
        <div class="hover-tip" id="tip" hidden></div>
        <button type="button" class="edge-toggle edge-left" id="toggle-left" aria-controls="panel-capas" aria-expanded="true"><span class="sr-only">Ocultar indicadores y capas</span><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M9 2 4 7l5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button type="button" class="edge-toggle edge-right" id="toggle-right" aria-controls="ficha" aria-expanded="true"><span class="sr-only">Ocultar ficha del lugar</span><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M9 2 4 7l5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>

      <aside class="panel panel-ficha" id="ficha" aria-label="Ficha del lugar seleccionado" aria-live="polite"></aside>
    </section>

    <section id="view-explorador" class="view view-explorador" aria-label="Explorador de datos" hidden></section>
    <section id="view-fuentes" class="view view-fuentes" aria-label="Fuentes" hidden></section>
  </main>
  <footer class="footer">
    <p>Hecho por <a href="https://mapabianchi.online" target="_blank" rel="noopener">Mapa Bianchi</a> · Diseño UX/UI y desarrollo web</p>
    <p class="footer-src">Datos públicos de INDEC, ministerios nacionales y fuentes abiertas · <button type="button" data-view="fuentes">Ver fuentes</button></p>
